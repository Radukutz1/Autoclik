<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autoclik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .og-image {
      width: 1200px;
      height: 630px;
      position: relative;
      background-color: #050505; /* Deep dark background */
      background-image: 
        /* Subtle neutral gray/silver glows for depth without color */
        radial-gradient(circle at 15% 30%, rgba(255, 255, 255, 0.05), transparent 50%),
        radial-gradient(circle at 85% 70%, rgba(255, 255, 255, 0.03), transparent 50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      
      /* Clean, stark white/gray glass edges */
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      border-right: 1px solid rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      
      border-radius: 24px;
      padding: 60px 100px;
      text-align: center;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8);
    }

    h1 {
      font-size: 6rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      /* Silver gradient text */
      background: linear-gradient(to right, #ffffff, #9ca3af);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-shadow: 0 4px 30px rgba(255,255,255,0.1);
    }

    p {
      color: #9ca3af;
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .url {
      margin-top: 40px;
      display: inline-block;
      padding: 10px 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e5e7eb;
      border-radius: 50px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="og-image">
    <div class="glass-card">
      <h1>AutoClik</h1>
     
      <div class="url">autoclik.net</div>
    </div>
  </div>

</body>
</html>
